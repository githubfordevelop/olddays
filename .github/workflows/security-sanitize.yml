name: Remove test key and audit credentials
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: credential-sanitization
  cancel-in-progress: false
jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Remove known upstream test key and audit current files
        run: python3 scripts/audit-sensitive.py --strip-test-fixture --report /tmp/current-audit.json
      - name: Audit history for real credentials
        run: python3 scripts/audit-sensitive.py --history --report /tmp/history-audit.json
      - name: Verify runtime sources and application
        run: |
          python3 scripts/check-pocket-data.py
          node scripts/check.mjs
      - name: Record sanitized archive and audit scope
        run: |
          python3 - <<'PY'
          import pathlib, json, hashlib, datetime, subprocess
          notice=pathlib.Path('dist/javame/RUNTIME-NOTICE.txt')
          note='Security packaging: upstream tests/cert.pem (public expired localhost test certificate and RSA key) is omitted from runtime-sources.tar.gz. It is not needed by the distributed runtime. Original component licenses remain included.'
          text=notice.read_text()
          if note not in text:
              notice.write_text(text.rstrip()+'\n\n'+note+'\n')
          report=json.loads(pathlib.Path('/tmp/current-audit.json').read_text())
          report['historical_audit']=json.loads(pathlib.Path('/tmp/history-audit.json').read_text())
          report['checked_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          report['checked_commit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          report['archive_sha256']=hashlib.sha256(pathlib.Path('dist/javame/runtime-sources.tar.gz').read_bytes()).hexdigest()
          pathlib.Path('docs/security-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit cleaned source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/javame/runtime-sources.tar.gz dist/javame/RUNTIME-NOTICE.txt docs/security-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Remove upstream test private key and verify cloud credential audit"
            git push origin HEAD:main
          fi
