name: Scrub test key from history and downloads
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: history-security-cleanup
  cancel-in-progress: false
jobs:
  scrub:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve cleanup tools outside rewritten checkout
        run: |
          test "$GITHUB_REPOSITORY" = githubfordevelop/olddays
          mkdir -p /tmp/olddays-history-tools
          cp scripts/audit-sensitive.py /tmp/olddays-history-tools/audit_sensitive.py
          cp scripts/scrub-history-test-key.py /tmp/olddays-history-tools/scrub_history.py
      - name: Rewrite leased branches and tags and sanitize all downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 /tmp/olddays-history-tools/scrub_history.py --auditor /tmp/olddays-history-tools/audit_sensitive.py --rewrite --push --assets --report /tmp/history-cleanup.json
      - name: Verify rewritten repository and runtime
        run: |
          git reset --hard refs/heads/main
          python3 scripts/audit-sensitive.py --report /tmp/final-current-audit.json
          python3 scripts/audit-sensitive.py --history --report /tmp/final-history-audit.json
          python3 scripts/check-pocket-data.py
          node scripts/check.mjs
      - name: Publish non-sensitive cleanup report
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          report=json.loads(pathlib.Path('/tmp/history-cleanup.json').read_text())
          report['current_audit']=json.loads(pathlib.Path('/tmp/final-current-audit.json').read_text())
          report['history_audit']=json.loads(pathlib.Path('/tmp/final-history-audit.json').read_text())
          assert report['history_audit']['stats']['historical_public_test_fixtures']==0
          report['checked_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          pathlib.Path('docs/history-security-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('docs/security-audit.json').write_text(json.dumps({'current':report['current_audit'],'history':report['history_audit'],'checked_at':report['checked_at']},ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/history-security-audit.json docs/security-audit.json
          git commit -m "Record clean history and release download verification"
          git push origin HEAD:main
