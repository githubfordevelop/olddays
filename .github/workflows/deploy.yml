name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript and local assets
        run: node scripts/check.mjs
      - name: Check deployment script
        run: bash -n scripts/deploy.sh
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish immutable release and switch current
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '121.40.22.96' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'olddays' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/srv/olddays' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy.sh
